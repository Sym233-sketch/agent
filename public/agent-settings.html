<main class="settings-shell"><div class="settings-heading"><span class="eyebrow">服务设置 / 模型服务</span><h1>模型服务配置</h1><p>选择服务商与模型，设置调用上限。密钥仅保存在本机后端进程内存，服务重启后需重新配置。</p></div><div class="settings-layout"><section class="settings"><h2>连接设置</h2><form id="settingsForm"><div class="row"><label>服务商<select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option></select></label><label>模型<select id="model"></select></label></div><div class="model-note" id="modelNote"></div><label id="keyLabel">服务商 API 密钥<input type="password" id="apiKey" autocomplete="off" placeholder="留空保留当前服务商已保存的密钥"></label><div class="row"><label>DeepSeek 思考方式<select id="reasoningEffort"><option value="none">快速模式</option><option value="low">深度思考</option></select></label><label>本次服务的 API 请求上限<input id="maxCalls" type="number" min="1" max="500" value="30"></label></div><label class="checkrow"><input id="searchEnabled" type="checkbox">启用官方文件联网搜索。DeepSeek 使用独立 Search API，结果仅保留 gov.cn；模型与搜索均可能计费。</label><div class="buttons"><button class="btn" type="submit">保存配置</button><button class="btn light" type="button" id="testModel">测试连接（消耗 API 额度）</button><button class="btn ghost" type="button" id="clearKey">清除当前密钥</button></div></form></section><aside class="settings-status" aria-label="连接状态与说明"><h2>当前连接状态</h2><pre id="status" role="status" aria-live="polite">正在读取连接状态…</pre><p>切换服务商需分别配置密钥。居民需重新确认相应服务商的模型处理授权。</p><a id="pricingLink" class="text-button" target="_blank" rel="noopener">查看官方模型与价格 ↗</a></aside></div><p class="settings-footnote">请求上限包含模型与独立搜索请求，不是金额预算。一次操作可能产生多个请求。密钥不会回显或写入浏览器存储。实名、银行与家庭登记接口尚未接入。</p></main><script src="agent-settings.js"></script><script src="care-scenery.js"></script><script src="care-doodles.js"></script></body></html>
