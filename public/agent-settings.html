<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>民策通 · 模型配置</title><link rel="stylesheet" href="user.css"><style>.settings{max-width:820px;margin:35px auto;padding:32px;background:#fffef9;border:1px solid #e1e8d6;border-radius:15px}.settings h1{font-size:26px}.settings p{font-size:13px;line-height:1.9;color:#758365}.settings pre{white-space:pre-wrap;font:13px/1.9 system-ui;background:#f1f6e8;padding:18px;border-radius:8px;color:#526b44}.settings .buttons{display:flex;gap:10px;flex-wrap:wrap}.settings .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}.settings label{display:block;margin:15px 0}.settings label.checkrow{display:flex}.settings select,.settings input:not([type=checkbox]){width:100%;margin-top:8px}.model-note{padding:14px 18px;border-left:3px solid #91a874;background:#f5f8ee}@media(max-width:700px){.settings{margin:20px;padding:22px}.settings .row{grid-template-columns:1fr}}</style><header class="entry-header"><a class="brand" href="/#policy"><span class="brandmark">民</span><div>民策通<small>AGENT MODEL SETTINGS</small></div></a><a href="/#policy" class="text-button">返回政府端</a></header><main class="settings"><span class="pill">实际 API 接入 · 密钥仅留本机内存</span><h1>让关怀连接真实的智能。</h1><p>支持 DeepSeek 与 OpenAI 官方接口。密钥只保存于后端进程内存，不回显、不写入网页或浏览器存储；服务重启后重新配置。切换服务商时分别保存密钥，居民需重新确认相应模型处理授权。</p><form id="settingsForm"><div class="row"><label>服务商<select id="provider"><option value="deepseek">DeepSeek · 推荐性价比方案</option><option value="openai">OpenAI</option></select></label><label>模型<select id="model"></select></label></div><div class="model-note" id="modelNote"></div><label id="keyLabel">服务商 API key<input type="password" id="apiKey" autocomplete="off" placeholder="留空保留该服务商现有密钥，不会沿用其他服务商的密钥"></label><div class="row"><label>DeepSeek 思考方式<select id="reasoningEffort"><option value="none">快速模式 · 日常对话与工具调用</option><option value="low">深度思考 · 复杂审稿与条件分析</option></select></label><label>本次服务运行的 API 请求上限<input id="maxCalls" type="number" min="1" max="500" value="30"></label></div><label class="checkrow"><input id="searchEnabled" type="checkbox">启用官方文件联网搜索：DeepSeek 使用独立 Search API，结果仅保留 gov.cn；模型与搜索均可能计费。</label><div class="buttons"><button class="btn" type="submit">保存到后端内存</button><button class="btn light" type="button" id="testModel">测试连接（会产生少量 API 用量）</button><button class="btn ghost" type="button" id="clearKey">清除当前服务商密钥</button></div></form><pre id="status">正在读取连接状态…</pre><p>请求上限包含模型与独立搜索请求，并非金额预算。一次对话可能执行多个模型步骤；程序限制输出长度与工具次数。银行、实名和家庭登记真实连接器尚未接入。</p><a id="pricingLink" class="text-button" target="_blank" rel="noopener">查看官方模型与价格 ↗</a></main><script src="agent-settings.js"></script></html>
